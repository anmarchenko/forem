version: '2.1'
setup: true
orbs:
  test-optimization-circleci-orb: datadog/test-optimization-circleci-orb@1
  continuation: circleci/continuation@0.2.0
jobs:
  plan:
    docker:
    - image: cimg/python:3.12
    steps:
    - checkout
    - run:
        name: Install Python dependencies
        command: python -m pip install -r requirements.txt "ddtrace>=4.11.0" pytest
    - test-optimization-circleci-orb/autoinstrument:
        languages: python
        site: datadoghq.com
    - run:
        name: Build pinned PR and start recorded Mockdog responses
        command: bash .verification/bootstrap.sh
    - run:
        name: Plan tests
        command: 'bin/ddtest plan --platform python --framework pytest

          cat .testoptimization/circleci/parameters.json'
        environment:
          DD_TEST_OPTIMIZATION_RUNNER_MIN_PARALLELISM: '2'
          DD_TEST_OPTIMIZATION_RUNNER_MAX_PARALLELISM: '3'
    - save_cache:
        key: ddtest-plan-{{ .Revision }}
        paths:
        - .testoptimization
        - bin/ddtest
    - continuation/continue:
        configuration_path: .circleci/test.yml
        parameters: .testoptimization/circleci/parameters.json
    environment:
      DD_API_KEY: dummy
      DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
      DD_CIVISIBILITY_AGENTLESS_URL: http://127.0.0.1:5267
      DD_TELEMETRY_AGENTLESS_URL: http://127.0.0.1:5267
      DD_INSTRUMENTATION_TELEMETRY_URL: http://127.0.0.1:5267
      DD_TEST_OPTIMIZATION_RUNNER_FORCE_FULL_TEST_DISCOVERY: 'true'
      DD_TEST_OPTIMIZATION_RUNNER_STRICT_DISCOVERY: 'true'
      DD_TEST_OPTIMIZATION_RUNNER_TESTS_LOCATION: tests/test_*.py
      DD_TESTOPTIMIZATION_TIA_TEST_SKIPPING_MODE: test
      DD_SERVICE: ddtest-empty-plan-verification
workflows:
  plan:
    jobs:
    - plan

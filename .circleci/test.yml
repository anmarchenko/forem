version: '2.1'
parameters:
  parallelism:
    type: integer
    default: 1
  has_tests:
    type: boolean
    default: false
orbs:
  test-optimization-circleci-orb: datadog/test-optimization-circleci-orb@1
jobs:
  test:
    parallelism: << pipeline.parameters.parallelism >>
    docker:
    - image: cimg/python:3.12
    steps:
    - run: echo WORKER_ALLOCATED
    - checkout
    - run:
        name: Start recorded Mockdog responses
        command: nohup python3 .verification/backend.py > /tmp/ddtest-verification-backend.log
          2>&1 < /dev/null &
    - restore_cache:
        keys:
        - ddtest-plan-{{ .Revision }}
    - run:
        name: Install Python dependencies
        command: python -m pip install -r requirements.txt "ddtrace>=4.11.0" pytest
    - test-optimization-circleci-orb/autoinstrument:
        languages: python
        site: datadoghq.com
    - run:
        name: Run tests
        command: 'export DD_TEST_SESSION_NAME="python-tests-${CIRCLE_NODE_INDEX:-0}"

          bin/ddtest run --platform python --framework pytest --ci-node "${CIRCLE_NODE_INDEX:-0}"

          '
    environment:
      DD_API_KEY: dummy
      DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
      DD_CIVISIBILITY_AGENTLESS_URL: http://127.0.0.1:5267
      DD_TELEMETRY_AGENTLESS_URL: http://127.0.0.1:5267
      DD_INSTRUMENTATION_TELEMETRY_URL: http://127.0.0.1:5267
      DD_TEST_OPTIMIZATION_RUNNER_FORCE_FULL_TEST_DISCOVERY: 'true'
      DD_TEST_OPTIMIZATION_RUNNER_STRICT_DISCOVERY: 'true'
      DD_TEST_OPTIMIZATION_RUNNER_TESTS_LOCATION: tests/test_*.py
      DD_TESTOPTIMIZATION_TIA_TEST_SKIPPING_MODE: test
      DD_SERVICE: ddtest-empty-plan-verification
workflows:
  test:
    when: << pipeline.parameters.has_tests >>
    jobs:
    - test

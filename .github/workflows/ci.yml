name: Verify documented Python empty-plan gate
env:
  DD_TEST_OPTIMIZATION_RUNNER_PLATFORM: python
  DD_TEST_OPTIMIZATION_RUNNER_FRAMEWORK: pytest
  DD_TEST_OPTIMIZATION_RUNNER_MIN_PARALLELISM: '2'
  DD_TEST_OPTIMIZATION_RUNNER_MAX_PARALLELISM: '3'
  DD_API_KEY: dummy
  DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
  DD_CIVISIBILITY_AGENTLESS_URL: http://127.0.0.1:5267
  DD_TELEMETRY_AGENTLESS_URL: http://127.0.0.1:5267
  DD_INSTRUMENTATION_TELEMETRY_URL: http://127.0.0.1:5267
  DD_TEST_OPTIMIZATION_RUNNER_FORCE_FULL_TEST_DISCOVERY: 'true'
  DD_TEST_OPTIMIZATION_RUNNER_STRICT_DISCOVERY: 'true'
  DD_TEST_OPTIMIZATION_RUNNER_TESTS_LOCATION: tests/test_*.py
  DD_TESTOPTIMIZATION_TIA_TEST_SKIPPING_MODE: test
  DD_SERVICE: ddtest-empty-plan-verification
jobs:
  dd_plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dd_plan.outputs.matrix }}
      has_tests: ${{ steps.dd_plan.outputs.has_tests }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 1.27.3
    - name: Build pinned PR and start recorded Mockdog responses
      run: bash .verification/bootstrap.sh
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt "ddtrace>=4.11.0" pytest
    - name: Configure Datadog Test Optimization
      uses: datadog/test-visibility-github-action@v2
      with:
        languages: python
        api_key: dummy
        site: datadoghq.com
    - id: dd_plan
      name: Plan test execution
      run: 'if [ "$(cat .verification/mode)" = "output-failure" ]; then mkdir -p .verification/blocked-output;
        export GITHUB_OUTPUT="$PWD/.verification/blocked-output"; fi

        bin/ddtest plan

        cat .testoptimization/runner/parallel-runners.txt

        cat .testoptimization/github/config'
    - uses: actions/upload-artifact@v4
      with:
        name: dd-artifacts
        path: .testoptimization
        include-hidden-files: true
    - name: Inspect runnable-work output
      run: echo "has_tests=${{ steps.dd_plan.outputs.has_tests }}"
  dd_test:
    runs-on: ubuntu-latest
    needs:
    - dd_plan
    if: ${{ needs.dd_plan.outputs.has_tests == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dd_plan.outputs.matrix) }}
    steps:
    - name: Worker allocation marker
      run: echo WORKER_ALLOCATED
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 1.27.3
    - name: Build pinned PR and start recorded Mockdog responses
      run: bash .verification/bootstrap.sh
    - uses: actions/download-artifact@v4
      with:
        name: dd-artifacts
        path: .testoptimization
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt "ddtrace>=4.11.0" pytest
    - name: Configure Datadog Test Optimization
      uses: datadog/test-visibility-github-action@v2
      with:
        languages: python
        api_key: dummy
        site: datadoghq.com
    - name: Run tests
      run: bin/ddtest run --ci-node ${{ matrix.ci_node_index }}
'on':
  push:
    branches:
    - anmarchenko/verify-ddtest-327

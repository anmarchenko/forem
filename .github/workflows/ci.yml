name: CI

on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-test-runner
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COVERAGE: true
  RAILS_ENV: test
  NODE_ENV: test
  DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/Forem_test
  DATABASE_NAME_TEST: Forem_test
  POSTGRES_PASSWORD: postgres
  YARN_ENABLE_HARDENED_MODE: 0
  DD_TRACE_DEBUG: 0
  DD_ENV: ci
  DD_SERVICE: forem
  DD_TEST_OPTIMIZATION_RUNNER_PLATFORM: ruby
  DD_TEST_OPTIMIZATION_RUNNER_FRAMEWORK: rspec
  DD_TEST_OPTIMIZATION_RUNNER_MIN_PARALLELISM: 1
  DD_TEST_OPTIMIZATION_RUNNER_MAX_PARALLELISM: 8
  DD_TEST_OPTIMIZATION_RUNNER_TEST_DISCOVERY_CACHE: .ddtest-cache/tests-discovery.json
  DD_TEST_OPTIMIZATION_RUNNER_TESTS_EXCLUDE_PATTERN: 'spec/ddtest/excluded/**/*_spec.rb'
  DD_TESTOPTIMIZATION_TIA_TEST_SKIPPING_MODE: suite
  DD_CIVISIBILITY_EARLY_FLAKE_DETECTION_ENABLED: 'false'
  DDTEST_REPOSITORY: https://github.com/DataDog/ddtest.git
  DDTEST_REF: 7c8fbd74e97ea3af14762d5dc503ab0d79139993
  DDTEST_VERSION: main-7c8fbd74
  DATADOG_CI_REF: 4eb38f6ebc7764c6d77fa3aaf8a2fdbe82243e50

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dd_plan.outputs.matrix }}
    env:
      E2E: true
      DD_TEST_OPTIMIZATION_RUNNER_RUNTIME_TAGS: '{"os.version":"6.12.80"}'

    steps:
      - uses: actions/checkout@v4
        with:
          # DDTest discovery cache validation needs the cache source commit locally.
          fetch-depth: 3
      - name: Restore DDTest discovery cache
        id: ddtest_discovery_cache
        uses: actions/cache/restore@v4
        with:
          path: .ddtest-cache/tests-discovery.json
          key: ddtest-discovery-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ddtest-discovery-${{ runner.os }}-${{ github.ref_name }}-
            ddtest-discovery-${{ runner.os }}-
            ddtest-discovery-
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Cache pre-compiled assets
        uses: actions/cache@v4
        id: assetscache
        with:
          path: |
            public/assets
          key: ${{ runner.os }}-compiled-assets-v3-${{ hashFiles( 'app/assets/**', 'app/javascript/**', '**/package.json', '**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-compiled-assets-v3-
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
        if: steps.assetscache.outputs.cache-hit != 'true'
      - run: yarn install --immutable
        if: steps.assetscache.outputs.cache-hit != 'true'
      - run: bundle exec rails assets:precompile
        if: steps.assetscache.outputs.cache-hit != 'true'
      - run: cp .env_sample .env
      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: ruby
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.eu
      - name: Verify datadog-ci main revision
        run: |
          LOCKED_DATADOG_CI_REF=$(awk '/remote: https:\/\/github.com\/DataDog\/datadog-ci-rb.git/{found=1} found && /revision:/{print $2; exit}' Gemfile.lock)
          echo "datadog-ci locked revision: $LOCKED_DATADOG_CI_REF"
          test "$LOCKED_DATADOG_CI_REF" = "$DATADOG_CI_REF"
          bundle info datadog-ci
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Build ddtest from main
        run: |
          git clone --filter=blob:none --no-checkout "$DDTEST_REPOSITORY" "$RUNNER_TEMP/ddtest"
          git -C "$RUNNER_TEMP/ddtest" fetch --depth 1 origin "$DDTEST_REF"
          git -C "$RUNNER_TEMP/ddtest" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/ddtest" rev-parse HEAD)" = "$DDTEST_REF"
          go -C "$RUNNER_TEMP/ddtest" build \
            -ldflags "-X github.com/DataDog/ddtest/internal/buildinfo.Version=$DDTEST_VERSION" \
            -o "$GITHUB_WORKSPACE/bin/ddtest" .
          bin/ddtest --version
      - id: dd_plan
        name: Setup Datadog Test Runner
        run: bin/ddtest plan
      - name: Verify and summarize DDTest plan
        run: |
          PLAN_DIR=.testoptimization/runner
          test -s "$PLAN_DIR/test-files.txt"
          if grep -Fq "spec/ddtest/excluded/exclude_pattern_canary_spec.rb" "$PLAN_DIR/test-files.txt" "$PLAN_DIR"/tests-split/runner-*; then
            echo "DDTest exclude pattern did not filter the canary spec" >&2
            exit 1
          fi
          cat "$PLAN_DIR"/tests-split/runner-* | sort > "$RUNNER_TEMP/split-files.txt"
          sort "$PLAN_DIR/test-files.txt" > "$RUNNER_TEMP/test-files.txt"
          diff "$RUNNER_TEMP/test-files.txt" "$RUNNER_TEMP/split-files.txt"
          test -z "$(uniq -d "$RUNNER_TEMP/split-files.txt")"
          {
            echo "ddtest=$DDTEST_VERSION ($DDTEST_REF)"
            echo "datadog-ci=$DATADOG_CI_REF"
            echo "site=$DD_SITE"
            echo "parallel-runners=$(cat "$PLAN_DIR/parallel-runners.txt")"
            echo "skippable-percentage=$(cat "$PLAN_DIR/skippable-percentage.txt")"
            echo "planned-files=$(wc -l < "$PLAN_DIR/test-files.txt" | tr -d ' ')"
            for split in "$PLAN_DIR"/tests-split/runner-*; do
              echo "$(basename "$split") files=$(wc -l < "$split" | tr -d ' ')"
              sed 's/^/  /' "$split"
            done
          } | tee "$PLAN_DIR/plan-summary.txt"
      - id: stage_ddtest_discovery_cache
        name: Stage latest DDTest discovery cache
        if: always()
        run: |
          if [ -f .testoptimization/tests-discovery/tests.json ]; then
            mkdir -p .ddtest-cache
            cp .testoptimization/tests-discovery/tests.json .ddtest-cache/tests-discovery.json
            echo "cache-ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save latest DDTest discovery cache
        if: always() && steps.stage_ddtest_discovery_cache.outputs.cache-ready == 'true' && steps.ddtest_discovery_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ddtest-cache/tests-discovery.json
          key: ${{ steps.ddtest_discovery_cache.outputs.cache-primary-key }}
      - name: Upload DD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dd-artifacts
          path: '.testoptimization'
          if-no-files-found: warn
          include-hidden-files: true

  rspec:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    env:
      DD_TEST_OPTIMIZATION_RUNNER_WORKER_ENV: DATABASE_URL_TEST=postgres://postgres:postgres@localhost:5432/Forem_test{{nodeIndex}};DATABASE_NAME_TEST=Forem_test{{nodeIndex}}
      DD_TEST_OPTIMIZATION_RUNTIME_TAGS: '{"os.version":"6.12.80"}'

    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
      redis:
        image: redis
        ports:
          - 6379:6379

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - name: Download DD artifacts
        uses: actions/download-artifact@v4
        with:
          name: dd-artifacts
          path: '.testoptimization'
      - name: Restore compiled assets
        uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: |
            public/assets
          key: ${{ runner.os }}-compiled-assets-v3-${{ hashFiles('app/assets/**', 'app/javascript/**', '**/package.json', '**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-compiled-assets-v3-
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: cp .env_sample .env
      - name: Prepare test database for this CI node
        run: |
          DATABASE_NAME="Forem_test${{ matrix.ci_node_index }}"
          DATABASE_URL_TEST="postgres://postgres:postgres@localhost:5432/${DATABASE_NAME}" \
            DATABASE_NAME_TEST="${DATABASE_NAME}" \
            bundle exec rails db:test:prepare
      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: ruby
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.eu
      - name: Verify datadog-ci main revision
        run: |
          LOCKED_DATADOG_CI_REF=$(awk '/remote: https:\/\/github.com\/DataDog\/datadog-ci-rb.git/{found=1} found && /revision:/{print $2; exit}' Gemfile.lock)
          echo "datadog-ci locked revision: $LOCKED_DATADOG_CI_REF"
          test "$LOCKED_DATADOG_CI_REF" = "$DATADOG_CI_REF"
          bundle info datadog-ci
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Build ddtest from main
        run: |
          git clone --filter=blob:none --no-checkout "$DDTEST_REPOSITORY" "$RUNNER_TEMP/ddtest"
          git -C "$RUNNER_TEMP/ddtest" fetch --depth 1 origin "$DDTEST_REF"
          git -C "$RUNNER_TEMP/ddtest" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/ddtest" rev-parse HEAD)" = "$DDTEST_REF"
          go -C "$RUNNER_TEMP/ddtest" build \
            -ldflags "-X github.com/DataDog/ddtest/internal/buildinfo.Version=$DDTEST_VERSION" \
            -o "$GITHUB_WORKSPACE/bin/ddtest" .
          bin/ddtest --version
      - name: Show assigned spec files
        run: |
          SPLIT=.testoptimization/runner/tests-split/runner-${{ matrix.ci_node_index }}
          echo "CI node ${{ matrix.ci_node_index }} executes $(wc -l < "$SPLIT" | tr -d ' ') spec files"
          cat "$SPLIT"
      - name: RSpec
        run: bin/ddtest run --ci-node ${{ matrix.ci_node_index }}
